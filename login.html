<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>เข้าสู่ระบบ - Factory Monitor Dashboard</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="login.css"></head><body class="login-body">
<main class="login-wrap">
  <section class="login-card" aria-labelledby="loginTitle">
    <div class="login-brand"><span class="login-logo">🏭</span><div><strong>Factory Monitor Dashboard</strong><small>ระบบสินค้าคงคลัง</small></div></div>
    <h1 id="loginTitle">เข้าสู่ระบบ</h1>
    <p class="login-sub">ใช้บัญชี Google (Gmail) ของคุณเพื่อเข้าใช้งานระบบคลังสินค้า</p>
    <button class="google-btn" id="googleLogin" type="button">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span>เข้าสู่ระบบด้วย Google</span>
    </button>
    <p class="login-msg" id="loginMsg" role="alert" hidden></p>
    <a class="offline-link" id="offlineLink" href="index.html" hidden>เข้าใช้งานแบบออฟไลน์ (ยังไม่ได้เชื่อม Supabase) →</a>
    <p class="login-foot">ข้อมูลสินค้าและประวัติการขนย้ายจัดเก็บอย่างปลอดภัยด้วย Supabase</p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="auth.js"></script>
<script>
(async () => {
  const btn = document.querySelector("#googleLogin");
  const msg = document.querySelector("#loginMsg");
  const show = text => { msg.textContent = text; msg.hidden = false; };
  const params = new URLSearchParams(location.search);
  if (params.get("error") === "domain") show(`บัญชีนี้ไม่ได้รับอนุญาต ต้องใช้อีเมล @${window.SUPABASE_CONFIG.allowedEmailDomain}`);
  if (params.get("error_description")) show(params.get("error_description"));
  if (!Auth.enabled) {
    btn.disabled = true;
    show("ยังไม่ได้ตั้งค่า Supabase ในไฟล์ config.js (ดูขั้นตอนใน README.md)");
    document.querySelector("#offlineLink").hidden = false;
    return;
  }
  const user = await Auth.getUser();
  if (user && Auth.domainOk(user)) { location.replace(Auth.pageUrl("index.html")); return; }
  btn.addEventListener("click", async () => {
    btn.disabled = true; btn.querySelector("span").textContent = "กำลังไปหน้า Google...";
    try { await Auth.signInWithGoogle(); }
    catch (e) { show("เข้าสู่ระบบไม่สำเร็จ: " + (e.message || e)); btn.disabled = false; btn.querySelector("span").textContent = "เข้าสู่ระบบด้วย Google"; }
  });
})();
</script></body></html>
